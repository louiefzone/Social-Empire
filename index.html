<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Social Empire</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#1d2333;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding:12px 12px 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.logo{font-weight:900;font-size:24px;letter-spacing:-.7px}.logo span{font-size:12px;color:#8991a5;font-weight:600;margin-left:5px}
.tools button{background:white;border:1px solid #dfe3ec;border-radius:9px;padding:7px 9px;color:#60697c;font-size:11px}
.hero{background:linear-gradient(135deg,#6575df,#7b55c9);color:white;border-radius:18px;padding:17px;box-shadow:0 8px 25px #6575df22}
.hero-top{display:flex;justify-content:space-between;gap:10px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.75}.money{font-size:30px;font-weight:900;margin-top:2px}.career{text-align:right}.career b{display:block;font-size:18px}.career small{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#ffffff18;border:1px solid #ffffff22;border-radius:12px;padding:9px}.stat span{display:block;font-size:9px;text-transform:uppercase;opacity:.7}.stat b{font-size:16px}
.card{background:#fff;border:1px solid #e2e5ed;border-radius:16px;padding:14px;margin-top:11px;box-shadow:0 4px 14px #1e29400a}.card h2{font-size:14px;margin:0 0 10px}.create-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.create{background:#f8f9fc;border:1px solid #e0e4ed;border-radius:13px;padding:11px;text-align:left;min-height:105px;color:#202638}.create:hover{border-color:#6979d8;transform:translateY(-1px)}.create:disabled{opacity:.45;cursor:not-allowed}.create .ico{font-size:22px}.create b{display:block;margin:3px 0}.create small{display:block;color:#7a8398;font-size:10px;line-height:1.3}.price{display:inline-block;margin-top:6px;background:#eceffd;color:#5968c4;border-radius:99px;padding:3px 6px;font-size:9px;font-weight:800}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.sub{font-size:10px;color:#8991a4}
.post{border:1px solid #e4e7ef;border-radius:13px;padding:11px;margin-top:8px;background:#fff}.post-head{display:flex;justify-content:space-between;gap:10px}.post-name{font-weight:800;font-size:13px}.post-status{font-size:10px;color:#7b8498}.pill{font-size:9px;border:1px solid #dfe3eb;border-radius:99px;padding:3px 6px;color:#687187;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.metric{background:#f6f7fa;border-radius:9px;padding:7px}.metric span{display:block;color:#8a92a4;font-size:8px}.metric b{display:block;font-size:12px;margin-top:2px}.refresh{width:100%;margin-top:8px;border:0;border-radius:10px;background:#6677df;color:#fff;padding:9px;font-weight:800}.refresh:disabled{background:#c5c9d5;cursor:not-allowed}.mini{margin-top:7px;font-size:10px;color:#8991a4}.bar{height:6px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin-top:7px}.bar div{height:100%;background:#7180dc}
.pop{position:fixed;inset:0;background:#10162dcc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.pop-box{max-width:430px;width:100%;background:#fff;border-radius:22px;padding:23px;text-align:center;box-shadow:0 20px 70px #0005;animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}.pop-icon{font-size:48px}.pop h2{margin:8px 0 5px;font-size:24px}.pop p{color:#727b90;line-height:1.45;font-size:13px}.pop .reward{font-size:30px;font-weight:900;color:#5f70d4;margin:13px 0}.pop button{width:100%;border:0;border-radius:11px;padding:11px;margin-top:7px;font-weight:800;background:#6677df;color:#fff}.pop button.alt{background:#eef0f6;color:#596276}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.tab{border:1px solid #dfe3eb;background:#fff;border-radius:10px;padding:8px;font-size:11px;color:#687187}.tab.active{background:#eef0ff;border-color:#b9c2f3;color:#5968c4;font-weight:800}
.tab-content{display:none}.tab-content.active{display:block}.upgrade{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4}.upgrade:last-child{border:0}.upgrade b{font-size:12px}.upgrade small{display:block;color:#8991a4;font-size:10px;margin-top:2px}.buy{background:#6677df;border:0;color:#fff;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800}.buy:disabled{background:#c9ccd5}.platform{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0f4}.platform:last-child{border:0}.platform b{font-size:12px}.platform small{display:block;color:#8a92a4;font-size:9px;margin-top:2px}.log{max-height:180px;overflow:auto}.log div{font-size:10px;color:#7e879a;padding:5px 0;border-bottom:1px solid #edf0f4}.empty{color:#9299aa;font-size:11px;text-align:center;padding:12px}
@media(max-width:520px){.create-grid{grid-template-columns:repeat(2,1fr)}.stats{gap:5px}.stat{padding:7px}.stat b{font-size:14px}.money{font-size:26px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">Social Empire <span>v2</span></div><div class="tools"><button onclick="save()">Save</button> <button onclick="resetGame()">Reset</button></div></div>

<div class="hero">
 <div class="hero-top">
  <div><div class="label">Cash</div><div class="money" id="cash">$100</div></div>
  <div class="career"><small>YOU ARE A</small><b id="career">Nobody</b><small id="next">First 100 followers</small></div>
 </div>
 <div class="stats">
  <div class="stat"><span>Followers</span><b id="followers">0</b></div>
  <div class="stat"><span>Fame</span><b id="fame">0</b></div>
  <div class="stat"><span>Views</span><b id="views">0</b></div>
 </div>
</div>

<div class="card">
 <div class="section-head"><h2>✨ Make a Post</h2><span class="sub">Pick anything. We'll handle the rest.</span></div>
 <div class="create-grid" id="createGrid"></div>
</div>

<div class="card">
 <div class="section-head"><h2>📱 Your Posts</h2><span class="sub" id="postHint">Tap CHECK RESULTS to see what happens.</span></div>
 <div id="posts"></div>
</div>

<div class="card">
 <div class="section-head"><h2>💼 Your Business</h2><span class="sub">Make money. Get bigger.</span></div>
 <div class="tabs">
  <button class="tab active" onclick="showTab('upgrades',this)">Upgrades</button>
  <button class="tab" onclick="showTab('platforms',this)">Platforms</button>
  <button class="tab" onclick="showTab('activity',this)">Activity</button>
 </div>
 <div id="upgrades" class="tab-content active"></div>
 <div id="platforms" class="tab-content"></div>
 <div id="activity" class="tab-content"></div>
</div>
</div>
<div id="popup"></div>

<script>
const D={
types:{
photo:{name:"Photo",icon:"📸",desc:"Quick, easy, keeps your audience interested.",time:4,cost:0,q:.50,r:.70,e:1,f:.55,m:.18},
short:{name:"Short Video",icon:"🎬",desc:"Fast growth and big viral potential.",time:6,cost:5,q:.72,r:1.45,e:1.1,f:1.28,m:.42},
text:{name:"Post",icon:"✍️",desc:"Start conversations with your audience.",time:2,cost:0,q:.45,r:.62,e:1.25,f:.72,m:.08},
long:{name:"Long Video",icon:"🎥",desc:"More work, but much more valuable.",time:11,cost:35,q:1,r:1.05,e:1.15,f:1.02,m:1.55},
podcast:{name:"Podcast",icon:"🎙️",desc:"Build a loyal audience and attract sponsors.",time:14,cost:45,q:.90,r:.72,e:1.35,f:.95,m:1.35},
live:{name:"Livestream",icon:"🔴",desc:"Connect with your audience in a big way.",time:16,cost:50,q:1,r:1.1,e:1.5,f:1.18,m:1.25}
},
platforms:{
vibra:{name:"Vibra",icon:"◎",unlock:0,base:.075,disc:1,r:2.1},
loop:{name:"Loop",icon:"▶",unlock:500,base:.045,disc:2.5,r:1.2},
pulse:{name:"Pulse",icon:"✦",unlock:1000,base:.065,disc:1.25,r:1.5},
viewtube:{name:"ViewTube",icon:"▣",unlock:2500,base:.055,disc:1.15,r:5.8},
castbox:{name:"Castbox",icon:"◉",unlock:5000,base:.07,disc:.65,r:7.5},
livewave:{name:"LiveWave",icon:"●",unlock:10000,base:.06,disc:1.35,r:4.2}
},
upgrades:[
{id:"phone",name:"Better Phone",cost:150,desc:"Your posts look better.",q:.08},
{id:"light",name:"Ring Light",cost:350,desc:"Better photos and videos.",q:.07},
{id:"edit",name:"Editing App",cost:700,desc:"Make better videos.",q:.10},
{id:"camera",name:"Creator Camera",cost:1800,desc:"A big quality boost.",q:.16},
{id:"mic",name:"Studio Mic",cost:2500,desc:"Better podcasts.",q:.12},
{id:"editor",name:"Hire an Editor",cost:5000,desc:"Videos get made faster.",tv:.35},
{id:"photog",name:"Hire a Photographer",cost:6500,desc:"Photos can be made automatically.",photo:true},
{id:"manager",name:"Hire a Social Manager",cost:9000,desc:"Your best post gets checked automatically.",manager:true},
{id:"producer",name:"Hire a Producer",cost:15000,desc:"You can make more posts at once.",producer:true},
{id:"stream",name:"Streaming Manager",cost:22000,desc:"Livestreams finish faster.",stream:true},
{id:"pod",name:"Podcast Producer",cost:30000,desc:"Podcasts finish faster.",pod:true},
{id:"creative",name:"Creative Director",cost:60000,desc:"Everything gets noticeably better.",q:.20,fc:.10},
{id:"company",name:"Your Production Company",cost:150000,desc:"You're running a real media business.",company:true}
]};
let S=JSON.parse(localStorage.getItem("socialEmpireSimple")||"null")||{
cash:100,followers:0,fame:0,views:0,created:0,posts:[],queue:[],equipment:[],logs:["Welcome! You're starting with zero followers. Let's change that."],seq:0,platformFollowers:{vibra:0,loop:0,pulse:0,viewtube:0,castbox:0,livewave:0},engHistory:[],popup:null
};
const has=id=>S.equipment.includes(id);
const money=n=>"$"+(n<1000?Math.floor(n):n<1e6?(n/1000).toFixed(1)+"K":(n/1e6).toFixed(2)+"M");
const fmt=n=>n<1000?Math.floor(n):n<1e6?(n/1000).toFixed(1)+"K":n<1e9?(n/1e6).toFixed(2)+"M":(n/1e9).toFixed(2)+"B";
function log(x){S.logs.unshift(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" — "+x);S.logs=S.logs.slice(0,45)}
function qBonus(){return S.equipment.reduce((a,id)=>a+(D.upgrades.find(x=>x.id===id)?.q||0),0)}
function avgEng(){let a=S.engHistory.slice(-15),v=a.reduce((x,y)=>x+y.v,0),e=a.reduce((x,y)=>x+y.e,0);return v?e/v:0}
function career(){let f=S.followers;if(f<100)return["Nobody","First 100 followers"];if(f<1000)return["Creator","People are noticing"];if(f<10000)return["Influencer","You've built an audience"];if(f<100000)return["Celebrity","Brands know you"];if(f<1000000)return["Star","You're a household name"];if(f<10000000)return["Mogul","You're running an empire"];return["Media Titan","You own the attention"]}
function unlocked(id){return S.followers>=D.platforms[id].unlock}
function prodTime(type){let t=D.types[type].time;if(has("producer"))t*=.75;if((type==="short"||type==="long")&&has("editor"))t*=.65;if(type==="live"&&has("stream"))t*=.65;if(type==="podcast"&&has("pod"))t*=.6;return Math.max(1,Math.ceil(t))}
function create(type){
 let c=D.types[type],slots=2+(has("producer")?2:0)+(has("company")?5:0);
 if(S.queue.length>=slots){log("Your team is busy. You can still check your published posts.");render();return}
 if(S.cash<c.cost){log("You need more cash for that post.");render();return}
 S.cash-=c.cost;S.seq++;
 S.queue.push({id:S.seq,type,remain:prodTime(type),total:prodTime(type),q:Math.min(1.65,c.q*(1+qBonus())*(.92+Math.random()*.16))});
 log(`${c.icon} Making ${c.name} #${S.seq}.`);render()
}
function finish(){
 for(let i=S.queue.length-1;i>=0;i--){let q=S.queue[i];q.remain--;if(q.remain<=0){let p={id:q.id,type:q.type,q:q.q,views:0,eng:0,foll:0,money:0,checks:0,state:"New",platforms:{}};S.posts.unshift(p);S.queue.splice(i,1);S.created++;log(`${D.types[q.type].icon} ${D.types[q.type].name} #${q.id} is ready!`);}}
}
function check(id){
 let p=S.posts.find(x=>x.id===id);if(!p||p.state==="Done")return;
 let c=D.types[p.type], life=p.checks<3?1:p.checks<7?.82:p.checks<12?.58:p.checks<17?.30:.08;
 let roll=Math.random(),mult=.6+Math.random()*1.25,event="",icon="";
 if(roll>.985){mult*=10;event="viral";icon="🚀"}
 else if(roll>.91){mult*=3.2;event="hot";icon="🔥"}
 else if(roll<.035){mult*=.25;event="cold";icon="🧊"}
 let total=0,eng=0,followers=0,rev=0;
 for(let [id,pl] of Object.entries(D.platforms)){
  if(!unlocked(id))continue;
  let base=S.platformFollowers[id]*pl.base;
  let discovery=(5+Math.pow(Math.max(1,S.followers),.48)*1.35)*pl.disc*c.r*p.q*life*mult;
  let views=Math.max(1,base+discovery);
  let er=Math.min(.25,Math.max(.008,.03*c.e*(.78+p.q*.42)*(.9+Math.random()*.22)));
  let e=views*er;
  let f=views*Math.min(.03,.00115*c.f*(.76+p.q*.5)*(1+(e/Math.max(views,1)))*((has("creative")?1.1:1)));
  let monetized=unlocked(id)&&S.followers>=(id==="castbox"?500:id==="livewave"?750:id==="loop"?5000:id==="pulse"?2500:1000)&&avgEng()>=(id==="castbox"?.10:id==="loop"?.06:id==="pulse"?.07:.05);
  let m=monetized?views/1000*pl.r*c.m:0;
  total+=views;eng+=e;followers+=f;rev+=m;
  S.platformFollowers[id]+=f;
  p.platforms[id]??={views:0,eng:0,foll:0,money:0};
  p.platforms[id].views+=views;p.platforms[id].eng+=e;p.platforms[id].foll+=f;p.platforms[id].money+=m;
 }
 p.views=p.views+total;p.eng+=eng;p.foll+=followers;p.money+=rev;p.checks++;
 p.state=p.checks<3?"New":p.checks<8?"Taking Off":p.checks<13?"Doing Well":p.checks<18?"Slowing Down":"Done";
 S.views+=total;S.followers+=followers;S.cash+=rev;S.fame+=total/100000;S.engHistory.push({v:total,e:eng});S.engHistory=S.engHistory.slice(-30);
 if(event==="viral"){showPopup("🚀","YOUR POST IS GOING VIRAL!",`People can't stop watching ${c.name.toLowerCase()}.`,`+${fmt(total)} views`,()=>{S.followers+=Math.max(20,followers*.4);log("🚀 Viral moment! Your audience exploded.");render()});}
 else if(event==="hot"){showPopup("🔥","PEOPLE ARE LOVING IT",`The algorithm is pushing your post to more people.`,`+${fmt(total)} views`,()=>render())}
 else if(event==="cold"){log(`${c.icon} A slow check: only +${fmt(total)} views.`)}
 else log(`${c.icon} ${c.name} #${p.id}: +${fmt(total)} views • +${fmt(followers)} followers${rev?` • +${money(rev)}`:""}`);
 maybeBusiness();
 render()
}
function maybeBusiness(){
 if(S.popup)return;
 let chance=S.followers<1000?.015:S.followers<10000?.035:S.followers<100000?.055:.08;
 if(Math.random()>chance)return;
 let deals=[
  {min:1000,icon:"💼",title:"A Brand Wants You",body:"A small brand loves your content and wants a sponsored post.",reward:Math.max(250,Math.floor(S.followers*.25)),label:"TAKE THE DEAL"},
  {min:10000,icon:"⭐",title:"BIG BRAND OPPORTUNITY",body:"A national brand wants you in its next campaign.",reward:Math.max(2500,Math.floor(S.followers*.55)),label:"SIGN THE DEAL"},
  {min:100000,icon:"🏆",title:"MAJOR CAMPAIGN",body:"This could become one of your biggest paydays yet.",reward:Math.max(15000,Math.floor(S.followers*.8)),label:"TAKE THE CAMPAIGN"}
 ];
 let d=deals.slice().reverse().find(x=>S.followers>=x.min);if(!d)return;
 showPopup(d.icon,d.title,d.body,money(d.reward),()=>{S.cash+=d.reward;S.fame+=d.reward/10000;log(`💼 Accepted a business deal for ${money(d.reward)}.`);render()})
}
function showPopup(icon,title,body,reward,action){S.popup={icon,title,body,reward,action};renderPopup()}
function renderPopup(){
 let e=document.getElementById("popup");if(!S.popup){e.innerHTML="";return}
 let p=S.popup;e.innerHTML=`<div class="pop"><div class="pop-box"><div class="pop-icon">${p.icon}</div><h2>${p.title}</h2><p>${p.body}</p><div class="reward">${p.reward}</div><button onclick="closePopup()">CONTINUE</button></div></div>`
}
function closePopup(){let a=S.popup?.action;S.popup=null;document.getElementById("popup").innerHTML="";if(a)a();else render()}
function buy(id){
 let u=D.upgrades.find(x=>x.id===id);if(!u||has(id))return;
 if(S.cash<u.cost){log("You don't have enough cash yet.");render();return}
 S.cash-=u.cost;S.equipment.push(id);log(`✨ Bought ${u.name}.`);render()
}
function showTab(id,b){document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function render(){
 let [c,n]=career();document.getElementById("cash").textContent=money(S.cash);document.getElementById("followers").textContent=fmt(S.followers);document.getElementById("fame").textContent=fmt(S.fame);document.getElementById("views").textContent=fmt(S.views);document.getElementById("career").textContent=c;document.getElementById("next").textContent=n;
 renderCreate();renderPosts();renderUpgrades();renderPlatforms();renderActivity();renderPopup()
}
function renderCreate(){
 let g=document.getElementById("createGrid");g.innerHTML="";
 Object.entries(D.types).forEach(([id,c])=>{let locked=!S.unlockable?.includes(id)&&!["photo","short","text"].includes(id);let b=document.createElement("button");b.className="create";b.disabled=locked;b.innerHTML=`<div class="ico">${c.icon}</div><b>${c.name}</b><small>${locked?"Unlock as your audience grows.":c.desc}</small><span class="price">${locked?"🔒 LOCKED":c.cost?money(c.cost):"FREE"} • ${prodTime(id)}s</span>`;if(!locked)b.onclick=()=>create(id);g.appendChild(b)})
}
function renderPosts(){
 let e=document.getElementById("posts");if(!S.posts.length&&!S.queue.length){e.innerHTML='<div class="empty">Make your first post. Your empire starts here.</div>';return}
 let q=S.queue.map(x=>{let c=D.types[x.type],pct=100*(1-x.remain/x.total);return `<div class="post"><div class="post-head"><div><div class="post-name">${c.icon} ${c.name} #${x.id}</div><div class="post-status">Making it... ${x.remain}s</div></div><span class="pill">${Math.round(pct)}%</span></div><div class="bar"><div style="width:${pct}%"></div></div></div>`}).join("");
 let posts=S.posts.slice(0,10).map(p=>{let c=D.types[p.type],er=p.views?p.eng/p.views:0;return `<div class="post"><div class="post-head"><div><div class="post-name">${c.icon} ${c.name} #${p.id}</div><div class="post-status">${p.state}</div></div><span class="pill">${p.checks} checks</span></div><div class="metrics"><div class="metric"><span>Views</span><b>${fmt(p.views)}</b></div><div class="metric"><span>Engagement</span><b>${(er*100).toFixed(1)}%</b></div><div class="metric"><span>Followers</span><b>+${fmt(p.foll)}</b></div><div class="metric"><span>Earned</span><b>${money(p.money)}</b></div></div><button class="refresh" ${p.state==="Done"?"disabled":""} onclick="check(${p.id})">${p.state==="Done"?"POST IS DONE":"✨ CHECK RESULTS"}</button></div>`}).join("");
 e.innerHTML=q+posts
}
function renderUpgrades(){let e=document.getElementById("upgrades");e.innerHTML=Object.values(D.upgrades).map(u=>`<div class="upgrade"><div><b>${u.name}</b><small>${u.desc}</small></div><button class="buy" ${has(u.id)||S.cash<u.cost?"disabled":""} onclick="buy('${u.id}')">${has(u.id)?"OWNED":money(u.cost)}</button></div>`).join("")}
function renderPlatforms(){let e=document.getElementById("platforms");e.innerHTML=Object.entries(D.platforms).map(([id,p])=>{let u=unlocked(id),m=id==="castbox"?.10:id==="loop"?.06:id==="pulse"?.07:.05;let req=id==="castbox"?500:id==="livewave"?750:id==="loop"?5000:id==="pulse"?2500:1000;let mon=u&&S.followers>=req&&avgEng()>=m;return `<div class="platform"><div><b>${p.icon} ${p.name}</b><small>${u?(mon?"💰 You're making money here.":"You're building an audience here."):"Unlocks at "+fmt(p.unlock)+" followers"}</small></div><span class="pill">${u?(mon?"MONETIZED":"ACTIVE"):"LOCKED"}</span></div>`}).join("")}
function renderActivity(){document.getElementById("activity").innerHTML=S.logs.map(x=>`<div>${x}</div>`).join("")}
function save(){localStorage.setItem("socialEmpireSimple",JSON.stringify(S));log("Game saved.");render()}
function resetGame(){if(confirm("Start Social Empire over?")){localStorage.removeItem("socialEmpireSimple");location.reload()}}
function unlockContent(){S.unlockable=[];if(S.followers>=2500)S.unlockable.push("long");if(S.followers>=5000)S.unlockable.push("podcast");if(S.followers>=10000)S.unlockable.push("live")}
setInterval(()=>{unlockContent();finish();render()},1000);unlockContent();render();
</script>
</body>
</html>
